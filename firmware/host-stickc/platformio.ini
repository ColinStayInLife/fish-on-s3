; =============================================
; FishOn-S3 — Host (M5StickC Plus)
; PlatformIO Project Configuration
; =============================================

[env:m5stick-c-plus]
platform = espressif32
board = m5stick-c-plus
framework = arduino

; Monitor settings
monitor_speed = 115200
monitor_filters = time

; Build flags
build_flags =
    ; BLE
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BTDM_CONTROLLER_MODE_BTDM=1
    ; M5StickC library
    -DM5STICKCPLUS
    ; Shared protocol path
    -I../../shared

; Libraries
lib_deps =
    ; M5StickC Plus library (includes IMU6886, LCD, speaker)
    m5stack/M5StickCPlus@^0.4.0
    ; ESP32 BLE Arduino (for scanning)
    esphome/esphome@^2023.12.0
    ; OR use native NimBLE for scanning
    h2zero/NimBLE-Arduino@^1.4.1

; Speed optimization for BLE scanning
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
