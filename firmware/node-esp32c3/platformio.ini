; =============================================
; FishOn-S3 — Rod-tip Sub-node (ESP32-C3)
; PlatformIO Project Configuration
; =============================================

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Monitor settings
monitor_speed = 115200
monitor_filters = time

; Build flags
build_flags =
    ; Use NimBLE (lightweight, no classic BT)
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    ; Run C3 at lower frequency to save power
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=80
    ; Shared protocol path
    -I../../shared

; Libraries
lib_deps =
    ; MPU6050 driver
    electroniccats/MPU6050@^1.1.2
    ; NimBLE for BLE advertising (lightweight)
    h2zero/NimBLE-Arduino@^1.4.1

; Partition table (small for 4MB flash)
board_build.flash_mode = qio
board_build.f_cpu = 80000000L

; Reduce stack size for lower RAM usage
board_build.arduino.stack_size = 8192
